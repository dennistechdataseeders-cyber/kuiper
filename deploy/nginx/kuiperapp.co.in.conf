# /etc/nginx/sites-available/kuiperapp.co.in.conf
#
# KUIPER frontend (Vite build) at https://kuiperapp.co.in
#
# Assumptions - change them if your server differs:
#   * the live build is the folder the symlink /var/www/kuiper/current points to
#     (deploy/deploy.sh builds into /var/www/kuiper/releases/<time> and swaps the link)
#   * Let's Encrypt certificates from certbot in /etc/letsencrypt/live/kuiperapp.co.in/
#
# Test and apply:  sudo nginx -t && sudo systemctl reload nginx

# ---- http -> https --------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name kuiperapp.co.in www.kuiperapp.co.in;

    # certbot renewals
    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    location / { return 301 https://kuiperapp.co.in$request_uri; }
}

# ---- www -> apex ----------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.kuiperapp.co.in;

    ssl_certificate     /etc/letsencrypt/live/kuiperapp.co.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kuiperapp.co.in/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    return 301 https://kuiperapp.co.in$request_uri;
}

# ---- the app ----------------------------------------------------------------
server {
    # HTTP/2. On nginx 1.25.1+ you may instead write "listen 443 ssl;" plus "http2 on;"
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name kuiperapp.co.in;

    ssl_certificate     /etc/letsencrypt/live/kuiperapp.co.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kuiperapp.co.in/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_session_cache shared:SSL_kuiper:10m;
    ssl_session_timeout 1d;

    root /var/www/kuiper/current;
    index index.html;

    # ---- compression ----
    # The build already contains .gz (and .br) copies of every asset (scripts/precompress.mjs);
    # gzip_static sends them without compressing on each request.
    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/javascript application/json image/svg+xml;

    # Brotli (smaller than gzip). Needs the nginx brotli module:
    #   sudo apt install libnginx-mod-http-brotli-filter libnginx-mod-http-brotli-static
    # (Ubuntu 24.04+; on older releases check `nginx -V` / your package source.)
    # When installed, remove the "#" from the next lines:
    # brotli on;
    # brotli_static on;
    # brotli_comp_level 6;
    # brotli_types text/plain text/css text/xml application/javascript application/json image/svg+xml;

    # ---- hashed build files: cache for a year, never revalidate ----
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        try_files $uri =404;   # a missing chunk must be a 404, never index.html
    }

    # ---- public/ files without a hash in the name (logo, favicon) ----
    location /images/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
        access_log off;
        try_files $uri =404;
    }

    # ---- index.html: always revalidate so a deploy is picked up immediately ----
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        expires off;
    }

    # ---- SPA fallback: every app route serves index.html ----
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }

    # basic hardening
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
