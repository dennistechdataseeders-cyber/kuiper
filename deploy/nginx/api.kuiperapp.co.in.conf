# /etc/nginx/sites-available/api.kuiperapp.co.in.conf
#
# KUIPER API (Express on PM2, port 5000) + socket.io at https://api.kuiperapp.co.in
#
# Assumption: Let's Encrypt certificate in /etc/letsencrypt/live/api.kuiperapp.co.in/
# (if one certificate covers both names, point both lines at that folder).
#
# Test and apply:  sudo nginx -t && sudo systemctl reload nginx

# Keep a pool of open connections to Node instead of a new TCP connection per request
upstream kuiper_api {
    server 127.0.0.1:5000;
    keepalive 32;
}

# "Connection: upgrade" only for WebSocket requests (socket.io); keep-alive for the rest
map $http_upgrade $kuiper_connection {
    default upgrade;
    ''      '';
}

server {
    listen 80;
    listen [::]:80;
    server_name api.kuiperapp.co.in;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://api.kuiperapp.co.in$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.kuiperapp.co.in;

    ssl_certificate     /etc/letsencrypt/live/api.kuiperapp.co.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.kuiperapp.co.in/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_session_cache shared:SSL_kuiper_api:10m;
    ssl_session_timeout 1d;

    # Uploads (tickets, leads, profile pictures). Express allows 50 MB JSON bodies.
    client_max_body_size 50m;

    # Express compresses its own responses (compression middleware). This is only a fallback
    # for anything it skips; nginx never compresses a response twice.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types application/json text/plain text/css application/javascript;

    # Common proxy settings
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $kuiper_connection;

    proxy_connect_timeout 5s;     # Node is local: if it does not accept in 5 s it is down
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;    # longest normal API call; uploads/exports finish well within this

    # socket.io: long-lived WebSocket / long-polling connections, no buffering
    location /socket.io/ {
        proxy_pass http://kuiper_api;
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location / {
        proxy_pass http://kuiper_api;
    }
}
